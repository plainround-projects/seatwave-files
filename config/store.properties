# Where the lab's programs find the stack of compose.yaml. The credentials are not here: they are
# files in .secrets/, generated by scripts/stack.sh up.
endpoint=http://127.0.0.1:22900
# RustFS answers any region in a signature; S3 needs the bucket's own.
region=us-east-1
jdbcUrl=jdbc:postgresql://127.0.0.1:22920/seatwave
databaseUser=seatwave_files
